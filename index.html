    <script>
      // 首屏前确定主题，避免暗色模式闪烁（与 src/composables/useTheme.js 口径一致）
      (function () {
        try {
          var saved = localStorage.getItem('edt:theme')
          var dark =
            saved === 'dark' ||
            ((saved !== 'light') &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var themeColorMeta = document.getElementById('edt-theme-color')
          if (themeColorMeta) themeColorMeta.setAttribute('content', dark ? '#0f1115' : '#f8f9fa')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
